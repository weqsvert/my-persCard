<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe6f1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">

<title>✦ Макарова Ульяна</title>
<meta name="description" content="Ульяна Макарова: студентка 2 курса, системное программирование. Веб, дизайн, игры. Спроси меня в терминале.">
<script>document.documentElement.classList.add("js");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
</head>
<body>

<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<div class="glow" id="glow" aria-hidden="true"></div>
<button class="sound" id="sound" aria-label="Включить или выключить звук" aria-pressed="true">🔊</button>
<button class="sound lang" id="lang" aria-label="Language / Язык">EN</button>
<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <section class="hero">
    <div class="hero-text">
      <p class="tag" data-i18n="tag">✦ студентка 2 курса · системное программирование</p>
      <h1 aria-label="Ульяна Макарова" title="Нажми на меня ✦">
        <span class="line" data-split>Ульяна</span>
        <span class="line" data-split>Макарова</span>
      </h1>
      <p class="lead" data-i18n="lead">Творческий разработчик в процессе. Нравится веб, дизайн и игры.</p>
      <a class="cta" href="#terminal" data-i18n="cta">Спроси меня в терминале ↓</a>
    </div>
    <div class="stack" id="stack"></div>
  </section>

  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

  <section class="journey" id="journey">
    <p class="j-label" data-i18n="jLabel"></p>
    <h2 data-i18n="jTitle"></h2>
    <div class="tl-wrap"><div class="tl-line"><i id="tlFill"></i></div><ol class="tl" id="tl"></ol></div>
  </section>

  <section class="term-wrap" id="terminal">
    <div class="term" id="term">
      <div class="term-bar"><i></i><i></i><i></i><span>visitka — zsh</span></div>
      <div class="term-body" id="out" aria-live="polite"></div>
      <form class="term-input" id="form">
        <span class="ps" id="ps1"></span>
        <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Введите команду, например help">
      </form>
    </div>
    <div class="chips" id="chips"></div>
    <p class="hint" data-i18n="hint">Нажми <kbd>/</kbd>, чтобы ввести команду, <kbd>Tab</kbd> дополняет, <kbd>↑</kbd> вспоминает прошлую.</p>
  </section>
</main>

<footer>
  <span>© <span id="year"></span> <span data-i18n="name">Ульяна Макарова</span></span>
  <span id="clock"></span>
</footer>

<script src="card.js"></script>
</body>
</html>
